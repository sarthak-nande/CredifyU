<!-- Mobile Screenshot for PWA Install -->
<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#000000"/>
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="390" height="40" fill="#000000"/>
  <text x="20" y="25" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">9:41</text>
  <text x="320" y="25" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">100%</text>
  
  <!-- Header -->
  <rect x="0" y="40" width="390" height="70" fill="#111111"/>
  
  <!-- CredifyU Logo and Title -->
  <circle cx="60" cy="75" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="60" cy="75" r="10" fill="none" stroke="#ffffff" stroke-width="1"/>
  <circle cx="60" cy="75" r="5" fill="#ffffff"/>
  <text x="90" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">CredifyU Scanner</text>
  
  <!-- Main Content -->
  <rect x="20" y="130" width="350" height="680" fill="#1a1a1a" rx="15"/>
  
  <!-- Title -->
  <text x="40" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="bold">QR Code Scanner</text>
  <text x="40" y="195" fill="#9ca3af" font-family="Arial, sans-serif" font-size="14">Scan student QR codes for verification</text>
  
  <!-- Scanner Area -->
  <rect x="40" y="220" width="310" height="310" fill="#2a2a2a" rx="10"/>
  <rect x="50" y="230" width="290" height="290" fill="#333333" rx="8" stroke="#4ade80" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- QR Code in center -->
  <rect x="145" y="325" width="100" height="100" fill="#ffffff" rx="4"/>
  <rect x="150" y="330" width="10" height="10" fill="#000000"/>
  <rect x="165" y="330" width="10" height="10" fill="#000000"/>
  <rect x="180" y="330" width="10" height="10" fill="#000000"/>
  <rect x="225" y="330" width="10" height="10" fill="#000000"/>
  <rect x="150" y="345" width="10" height="10" fill="#000000"/>
  <rect x="180" y="345" width="10" height="10" fill="#000000"/>
  <rect x="210" y="345" width="10" height="10" fill="#000000"/>
  <rect x="225" y="345" width="10" height="10" fill="#000000"/>
  <rect x="150" y="360" width="10" height="10" fill="#000000"/>
  <rect x="165" y="360" width="10" height="10" fill="#000000"/>
  <rect x="195" y="360" width="10" height="10" fill="#000000"/>
  <rect x="225" y="360" width="10" height="10" fill="#000000"/>
  
  <!-- Scanner Instructions -->
  <text x="195" y="570" fill="#4ade80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Position QR code within frame</text>
  
  <!-- Action Buttons -->
  <rect x="40" y="600" width="310" height="50" fill="#4ade80" rx="25"/>
  <text x="195" y="630" fill="#000000" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Start Scanning</text>
  
  <rect x="40" y="670" width="150" height="45" fill="#2a2a2a" rx="22" stroke="#ffffff" stroke-width="1"/>
  <text x="115" y="697" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Upload Image</text>
  
  <rect x="200" y="670" width="150" height="45" fill="#2a2a2a" rx="22" stroke="#ffffff" stroke-width="1"/>
  <text x="275" y="697" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">View History</text>
  
  <!-- Recent Scans -->
  <text x="40" y="750" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Recent Scans</text>
  
  <rect x="40" y="760" width="310" height="40" fill="#333333" rx="8"/>
  <circle cx="60" cy="780" r="12" fill="#4ade80"/>
  <text x="80" y="778" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">John Doe - Verified</text>
  <text x="80" y="790" fill="#9ca3af" font-family="Arial, sans-serif" font-size="10">2 minutes ago</text>
</svg>
